<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — Hectic Records</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-bar {
    background: var(--ink); color: var(--paper);
    padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .admin-bar a { text-decoration: underline; font-size: 0.85rem; }
  .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }

  .lock-screen {
    max-width: 380px; margin: 90px auto; text-align: center;
    border: 2px solid var(--ink); border-radius: 10px; padding: 40px 30px;
  }
  .lock-screen input {
    width: 100%; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 6px;
    font-family: inherit; margin: 16px 0; font-size: 1rem;
  }
  .lock-screen p.error { color: var(--rust); font-size: 0.85rem; }

  .admin-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  #save-status { font-size: 0.9rem; font-weight: 600; }
  #save-status.ok { color: #3d7a3d; }
  #save-status.error { color: var(--rust); }

  .stock-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  .stock-table th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em; padding: 8px 6px; border-bottom: 2px solid var(--ink); }
  .stock-table td { padding: 8px 6px; border-bottom: 1px solid var(--paper-line); vertical-align: top; }
  .stock-table input[type="text"], .stock-table input[type="number"], .stock-table input[type="date"], .stock-table select {
    width: 100%; padding: 7px 8px; border: 1.5px solid var(--paper-line); border-radius: 5px; font-family: inherit; font-size: 0.85rem;
  }
  .stock-table input:focus, .stock-table select:focus { outline: none; border-color: var(--teal); }
  .col-artist { min-width: 130px; }
  .col-title { min-width: 150px; }
  .col-price { width: 80px; }
  .col-genre { min-width: 120px; }
  .col-format { width: 70px; }
  .col-tags { width: 130px; }
  .col-accent { width: 90px; }
  .col-release { width: 130px; }
  .col-remove { width: 40px; text-align: center; }
  .col-cover { width: 76px; }

  .cover-cell { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .cover-preview {
    width: 60px; height: 60px; border-radius: 6px; border: 1.5px solid var(--paper-line);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: var(--paper); flex-shrink: 0;
  }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }
  .cover-preview__empty { font-size: 0.6rem; opacity: 0.55; text-align: center; padding: 4px; }
  .cover-upload-label {
    font-size: 0.72rem; font-weight: 700; text-decoration: underline; cursor: pointer; text-align: center;
  }

  .tag-check { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; margin-bottom: 3px; }
  .accent-swatches { display: flex; gap: 5px; }
  .accent-swatch {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
  }
  .accent-swatch[data-a="1"] { background: var(--rust); }
  .accent-swatch[data-a="2"] { background: var(--teal); }
  .accent-swatch[data-a="3"] { background: var(--gold); }
  .accent-swatch[data-a="4"] { background: var(--ink); }
  .accent-swatch[data-a="5"] { background: #6B7F4A; }
  .accent-swatch.is-selected { border-color: var(--ink); box-shadow: 0 0 0 2px var(--paper); }

  .remove-row-btn {
    background: none; border: none; color: var(--rust); cursor: pointer; font-size: 1.1rem; padding: 4px;
  }

  .genre-manager {
    border: 2px solid var(--ink); border-radius: 8px; padding: 20px; margin-bottom: 32px;
  }
  .genre-manager__list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
  .genre-chip {
    background: var(--white); border: 1.5px solid var(--paper-line); border-radius: 999px;
    padding: 5px 12px; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px;
  }
  .genre-chip button { background: none; border: none; color: var(--rust); cursor: pointer; font-weight: 700; }
  .add-genre-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .add-genre-row input { padding: 9px 12px; border: 2px solid var(--ink); border-radius: 6px; font-family: inherit; }
</style>
</head>
<body>

<div id="lock-screen" class="lock-screen">
  <h1 style="font-size:1.6rem;">Staff Login</h1>
  <p>Enter the staff password to manage stock.</p>
  <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
  <button class="btn btn--rust btn--full" id="unlock-btn">Log In</button>
  <p class="error" id="lock-error" style="display:none;"></p>
</div>

<div id="admin-app" style="display:none;">
  <div class="admin-bar">
    <strong>Hectic Records — Staff</strong>
    <a href="index.html">← Back to site</a>
  </div>

  <div class="admin-wrap">

    <div class="genre-manager">
      <h3 style="margin-bottom:2px;">Genres</h3>
      <p style="margin-bottom:0; font-size:0.85rem; opacity:0.75;">These power the genre tiles on the homepage and filter tabs in the shop.</p>
      <div class="genre-manager__list" id="genre-chip-list"></div>
      <div class="add-genre-row">
        <input type="text" id="new-genre-label" placeholder="New genre, e.g. Reggae">
        <button class="btn btn--outline" id="add-genre-btn" type="button">+ Add Genre</button>
      </div>
    </div>

    <div class="admin-toolbar">
      <h2 style="margin:0;">Stock (<span id="stock-count">0</span>)</h2>
      <div style="display:flex; gap:10px; align-items:center;">
        <span id="save-status"></span>
        <button class="btn btn--outline" id="add-row-btn" type="button">+ Add Record</button>
        <button class="btn btn--rust" id="save-btn" type="button">Save Changes</button>
      </div>
    </div>

    <div style="overflow-x:auto;">
    <table class="stock-table">
      <thead>
        <tr>
          <th class="col-cover">Cover</th>
          <th class="col-artist">Artist</th>
          <th class="col-title">Title</th>
          <th class="col-price">Price (£)</th>
          <th class="col-genre">Genre</th>
          <th class="col-format">Format</th>
          <th class="col-tags">Tags</th>
          <th class="col-release">Release date</th>
          <th class="col-accent">Fallback colour</th>
          <th class="col-remove"></th>
        </tr>
      </thead>
      <tbody id="stock-tbody"></tbody>
    </table>
    </div>

    <button class="btn btn--outline" id="add-row-btn-bottom" type="button">+ Add Record</button>
  </div>
</div>

<script src="js/products.js"></script>
<script>
  const PASSWORD_SESSION_KEY = "hectic_admin_pw";
  let genres = {};
  let stock = [];
  let idCounter = 1;

  function slugify(label) {
    return label.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  function nextId() {
    idCounter += 1;
    return "p" + Date.now().toString(36) + idCounter;
  }

  // Resizes and compresses an uploaded photo client-side before it's
  // stored, so cover art doesn't bloat the stock data. Aims for a
  // reasonable-quality thumbnail-to-medium sized JPEG.
  function compressImage(file, maxWidth) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxWidth / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.75));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function loadStock() {
    try {
      const res = await fetch("/api/products", { cache: "no-store" });
      if (res.ok) {
        const data = await res.json();
        genres = data.genres || {};
        stock = data.products || [];
        return;
      }
    } catch (e) { /* fall through to bundled data */ }
    genres = typeof GENRE_LABELS !== "undefined" ? GENRE_LABELS : {};
    stock = typeof PRODUCTS !== "undefined" ? PRODUCTS : [];
  }

  function renderGenres() {
    const list = document.getElementById("genre-chip-list");
    list.innerHTML = Object.entries(genres).map(([key, label]) => `
      <span class="genre-chip">${label}
        <button type="button" data-remove-genre="${key}" title="Remove genre" aria-label="Remove ${label}">×</button>
      </span>
    `).join("");
    list.querySelectorAll("[data-remove-genre]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.getAttribute("data-remove-genre");
        const inUse = stock.some((p) => p.genre === key);
        if (inUse && !confirm("Some records still use this genre — remove it anyway? Their genre will need reassigning.")) return;
        delete genres[key];
        renderGenres();
        renderGenreSelectsOptions();
      });
    });
  }

  function genreOptionsHTML(selected) {
    return Object.entries(genres).map(([key, label]) =>
      `<option value="${key}" ${key === selected ? "selected" : ""}>${label}</option>`
    ).join("");
  }

  function renderGenreSelectsOptions() {
    document.querySelectorAll("[data-field='genre']").forEach((select) => {
      const current = select.value;
      select.innerHTML = genreOptionsHTML(current);
    });
  }

  function rowHTML(p) {
    const hasPreorder = p.tags && p.tags.includes("pre-order");
    const hasNewIn = p.tags && p.tags.includes("new-in");
    return `
      <tr data-row="${p.id}">
        <td class="col-cover">
          <div class="cover-cell">
            <div class="cover-preview" data-cover-preview>
              ${p.image ? `<img src="${p.image}" alt="">` : `<span class="cover-preview__empty">No image</span>`}
            </div>
            <input type="file" accept="image/*" data-field="image-file" id="file-${p.id}" style="display:none;">
            <label class="cover-upload-label" for="file-${p.id}">Upload</label>
            <input type="hidden" data-field="image" value="${p.image || ""}">
          </div>
        </td>
        <td class="col-artist"><input type="text" data-field="artist" value="${p.artist || ""}" placeholder="Artist"></td>
        <td class="col-title"><input type="text" data-field="title" value="${p.title || ""}" placeholder="Album title"></td>
        <td class="col-price"><input type="number" step="0.01" min="0" data-field="price" value="${p.price ?? ""}"></td>
        <td class="col-genre"><select data-field="genre">${genreOptionsHTML(p.genre)}</select></td>
        <td class="col-format"><input type="text" data-field="format" value="${p.format || "LP"}"></td>
        <td class="col-tags">
          <label class="tag-check"><input type="checkbox" data-field="tag-new" ${hasNewIn ? "checked" : ""}> New In</label>
          <label class="tag-check"><input type="checkbox" data-field="tag-preorder" ${hasPreorder ? "checked" : ""}> Pre-Order</label>
        </td>
        <td class="col-release"><input type="date" data-field="releaseDate" value="${p.releaseDate || ""}"></td>
        <td class="col-accent">
          <div class="accent-swatches" data-field="accent">
            ${[1,2,3,4,5].map((n) => `<button type="button" class="accent-swatch ${p.accent === n ? "is-selected" : ""}" data-a="${n}" aria-label="Colour ${n}"></button>`).join("")}
          </div>
        </td>
        <td class="col-remove"><button type="button" class="remove-row-btn" data-remove-row aria-label="Delete record">🗑</button></td>
      </tr>
    `;
  }

  function renderStockTable() {
    const tbody = document.getElementById("stock-tbody");
    tbody.innerHTML = stock.map(rowHTML).join("");
    document.getElementById("stock-count").textContent = stock.length;

    tbody.querySelectorAll("[data-field='image-file']").forEach((input) => {
      input.addEventListener("change", async () => {
        const file = input.files[0];
        if (!file) return;
        const tr = input.closest("tr");
        const preview = tr.querySelector("[data-cover-preview]");
        const hiddenField = tr.querySelector("[data-field='image']");
        preview.innerHTML = `<span class="cover-preview__empty">Loading...</span>`;
        try {
          const dataUrl = await compressImage(file, 640);
          hiddenField.value = dataUrl;
          preview.innerHTML = `<img src="${dataUrl}" alt="">`;
        } catch (err) {
          preview.innerHTML = `<span class="cover-preview__empty">Couldn't load</span>`;
        }
      });
    });
    tbody.querySelectorAll("[data-remove-row]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const tr = btn.closest("tr");
        const id = tr.getAttribute("data-row");
        stock = stock.filter((p) => p.id !== id);
        renderStockTable();
      });
    });
    tbody.querySelectorAll(".accent-swatches").forEach((wrap) => {
      wrap.querySelectorAll(".accent-swatch").forEach((sw) => {
        sw.addEventListener("click", () => {
          wrap.querySelectorAll(".accent-swatch").forEach((s) => s.classList.remove("is-selected"));
          sw.classList.add("is-selected");
        });
      });
    });
  }

  function addBlankRow() {
    stock.push({ id: nextId(), artist: "", title: "", price: 0, genre: Object.keys(genres)[0] || "", tags: [], format: "LP", accent: 1 });
    renderStockTable();
    const rows = document.querySelectorAll("#stock-tbody tr");
    const lastRow = rows[rows.length - 1];
    if (lastRow) lastRow.querySelector("[data-field='artist']").focus();
  }

  function collectStockFromForm() {
    const rows = document.querySelectorAll("#stock-tbody tr");
    return Array.from(rows).map((tr) => {
      const id = tr.getAttribute("data-row");
      const get = (field) => tr.querySelector(`[data-field="${field}"]`);
      const tags = [];
      if (get("tag-new").checked) tags.push("new-in");
      if (get("tag-preorder").checked) tags.push("pre-order");
      const selectedSwatch = tr.querySelector(".accent-swatch.is-selected");
      const releaseDate = get("releaseDate").value;
      const image = get("image").value;

      const product = {
        id,
        artist: get("artist").value.trim(),
        title: get("title").value.trim(),
        price: parseFloat(get("price").value) || 0,
        genre: get("genre").value,
        format: get("format").value.trim() || "LP",
        tags,
        accent: selectedSwatch ? parseInt(selectedSwatch.getAttribute("data-a"), 10) : 1,
      };
      if (releaseDate) product.releaseDate = releaseDate;
      if (image) product.image = image;
      return product;
    });
  }

  function setStatus(message, kind) {
    const el = document.getElementById("save-status");
    el.textContent = message;
    el.className = kind || "";
  }

  async function saveStock() {
    const password = sessionStorage.getItem(PASSWORD_SESSION_KEY);
    const updatedStock = collectStockFromForm();

    const missing = updatedStock.find((p) => !p.artist || !p.title || !p.genre || !p.price);
    if (missing) {
      setStatus("Every record needs an artist, title, price and genre before saving.", "error");
      return;
    }

    const payloadStr = JSON.stringify({ products: updatedStock, genres });
    const approxMB = (payloadStr.length / (1024 * 1024)).toFixed(1);
    if (payloadStr.length > 5.5 * 1024 * 1024) {
      setStatus(`That's a big save (~${approxMB}MB, mostly photos) — likely too large in one go. Try saving in a couple of smaller batches.`, "error");
      return;
    }

    setStatus("Saving...", "");
    try {
      const res = await fetch("/api/products/save", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Admin-Password": password || "" },
        body: JSON.stringify({ products: updatedStock, genres }),
      });
      const data = await res.json();
      if (res.status === 401) {
        setStatus("Wrong password — try unlocking again.", "error");
        sessionStorage.removeItem(PASSWORD_SESSION_KEY);
        showLockScreen();
        return;
      }
      if (!res.ok) throw new Error(data.error || "Save failed");
      stock = updatedStock;
      setStatus("Saved — changes are live on the site.", "ok");
    } catch (err) {
      setStatus("Couldn't save: " + err.message, "error");
    }
  }

  function showLockScreen() {
    document.getElementById("lock-screen").style.display = "block";
    document.getElementById("admin-app").style.display = "none";
  }

  async function unlockAndInit(password) {
    sessionStorage.setItem(PASSWORD_SESSION_KEY, password);
    document.getElementById("lock-screen").style.display = "none";
    document.getElementById("admin-app").style.display = "block";
    await loadStock();
    renderGenres();
    renderStockTable();
  }

  document.getElementById("unlock-btn").addEventListener("click", () => {
    const pw = document.getElementById("password-input").value;
    if (!pw) {
      document.getElementById("lock-error").textContent = "Enter a password.";
      document.getElementById("lock-error").style.display = "block";
      return;
    }
    document.getElementById("lock-error").style.display = "none";
    unlockAndInit(pw);
  });
  document.getElementById("password-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("unlock-btn").click();
  });

  document.getElementById("add-row-btn").addEventListener("click", addBlankRow);
  document.getElementById("add-row-btn-bottom").addEventListener("click", addBlankRow);
  document.getElementById("save-btn").addEventListener("click", saveStock);

  document.getElementById("add-genre-btn").addEventListener("click", () => {
    const input = document.getElementById("new-genre-label");
    const label = input.value.trim();
    if (!label) return;
    const key = slugify(label);
    if (!key || genres[key]) { input.value = ""; return; }
    genres[key] = label;
    input.value = "";
    renderGenres();
    renderGenreSelectsOptions();
  });

  // A password was already entered this session — skip straight in
  // (still re-validated by the server on the next save attempt).
  const existingPassword = sessionStorage.getItem(PASSWORD_SESSION_KEY);
  if (existingPassword) {
    unlockAndInit(existingPassword);
  }
</script>
</body>
</html>
